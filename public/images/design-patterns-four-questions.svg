<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Four questions behind four software design patterns</title>
  <desc id="desc">Factory answers who creates it, Strategy answers which approach, Adapter answers how they connect, and Observer answers who needs to know.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091019"/>
      <stop offset="1" stop-color="#17202c"/>
    </linearGradient>
    <radialGradient id="center" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#214b3b"/>
      <stop offset="1" stop-color="#13251f"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/>
  <g fill="none" stroke="#3adf9a" stroke-width="3" opacity=".55">
    <path d="M525 320 C420 270 398 218 352 194"/>
    <path d="M675 320 C780 270 802 218 848 194"/>
    <path d="M525 400 C420 450 398 502 352 526"/>
    <path d="M675 400 C780 450 802 502 848 526"/>
  </g>
  <circle cx="600" cy="360" r="125" fill="url(#center)" stroke="#51e6a6" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="337" fill="#7cf1bd" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" text-anchor="middle">RECURRING</text>
  <text x="600" y="372" fill="#f6f9fb" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">design problem</text>
  <text x="600" y="406" fill="#b7c3cf" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Name the problem first</text>

  <g filter="url(#shadow)">
    <rect x="90" y="90" width="340" height="205" rx="24" fill="#18232e" stroke="#39495a" stroke-width="2"/>
    <rect x="770" y="90" width="340" height="205" rx="24" fill="#18232e" stroke="#39495a" stroke-width="2"/>
    <rect x="90" y="425" width="340" height="205" rx="24" fill="#18232e" stroke="#39495a" stroke-width="2"/>
    <rect x="770" y="425" width="340" height="205" rx="24" fill="#18232e" stroke="#39495a" stroke-width="2"/>
  </g>
  <g font-family="Arial, sans-serif">
    <circle cx="140" cy="142" r="23" fill="#214b3b"/><text x="140" y="151" fill="#79efb9" font-size="25" font-weight="700" text-anchor="middle">1</text>
    <text x="180" y="149" fill="#f5f7fa" font-size="26" font-weight="700">Who creates it?</text>
    <text x="140" y="204" fill="#54e2a2" font-size="21" font-weight="700">FACTORY</text>
    <text x="140" y="244" fill="#aab8c7" font-size="17">Hide construction details</text>
    <text x="140" y="268" fill="#aab8c7" font-size="17">behind one clear boundary.</text>

    <circle cx="820" cy="142" r="23" fill="#214b3b"/><text x="820" y="151" fill="#79efb9" font-size="25" font-weight="700" text-anchor="middle">2</text>
    <text x="860" y="149" fill="#f5f7fa" font-size="26" font-weight="700">Which approach?</text>
    <text x="820" y="204" fill="#54e2a2" font-size="21" font-weight="700">STRATEGY</text>
    <text x="820" y="244" fill="#aab8c7" font-size="17">Swap behavior without changing</text>
    <text x="820" y="268" fill="#aab8c7" font-size="17">the job that needs it.</text>

    <circle cx="140" cy="477" r="23" fill="#214b3b"/><text x="140" y="486" fill="#79efb9" font-size="25" font-weight="700" text-anchor="middle">3</text>
    <text x="180" y="484" fill="#f5f7fa" font-size="26" font-weight="700">How do they connect?</text>
    <text x="140" y="539" fill="#54e2a2" font-size="21" font-weight="700">ADAPTER</text>
    <text x="140" y="579" fill="#aab8c7" font-size="17">Translate between systems that</text>
    <text x="140" y="603" fill="#aab8c7" font-size="17">were not made for each other.</text>

    <circle cx="820" cy="477" r="23" fill="#214b3b"/><text x="820" y="486" fill="#79efb9" font-size="25" font-weight="700" text-anchor="middle">4</text>
    <text x="860" y="484" fill="#f5f7fa" font-size="26" font-weight="700">Who needs to know?</text>
    <text x="820" y="539" fill="#54e2a2" font-size="21" font-weight="700">OBSERVER</text>
    <text x="820" y="579" fill="#aab8c7" font-size="17">Announce an event so interested</text>
    <text x="820" y="603" fill="#aab8c7" font-size="17">parts can react independently.</text>
  </g>
</svg>
