<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Four design patterns cooperating in a notification workflow</title>
  <desc id="desc">An order event passes through Observer, Strategy, Factory, and Adapter before reaching an external message provider.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1017"/>
      <stop offset="1" stop-color="#17212c"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33d993"/>
      <stop offset="1" stop-color="#83f1c2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#58e5a7"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/>
  <text x="600" y="70" fill="#f5f8fa" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">One event, four different responsibilities</text>
  <text x="600" y="107" fill="#9aa8b8" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Each boundary answers one question and passes the work forward</text>

  <rect x="45" y="275" width="170" height="170" rx="85" fill="#17362c" stroke="#43df9d" stroke-width="3" filter="url(#shadow)"/>
  <path d="M103 349 h54 M130 322 v54" stroke="#79efb9" stroke-width="6" stroke-linecap="round"/>
  <text x="130" y="408" fill="#f3fff9" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">ORDER</text>
  <text x="130" y="430" fill="#b8d4c8" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">completed</text>

  <g filter="url(#shadow)">
    <rect x="270" y="230" width="190" height="260" rx="24" fill="#192530" stroke="#405365" stroke-width="2"/>
    <rect x="500" y="230" width="190" height="260" rx="24" fill="#192530" stroke="#405365" stroke-width="2"/>
    <rect x="730" y="230" width="190" height="260" rx="24" fill="#192530" stroke="#405365" stroke-width="2"/>
    <rect x="960" y="230" width="190" height="260" rx="24" fill="#192530" stroke="#405365" stroke-width="2"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="365" cy="291" r="30" fill="#214b3b"/><path d="M350 291 q15 -17 30 0 q-15 17 -30 0" fill="none" stroke="#7aefba" stroke-width="3"/><circle cx="365" cy="291" r="5" fill="#7aefba"/>
    <text x="365" y="354" fill="#72ecb3" font-size="16" font-weight="700" letter-spacing="2">OBSERVER</text>
    <text x="365" y="390" fill="#f4f7fa" font-size="21" font-weight="700">Notice it</text>
    <text x="365" y="423" fill="#a9b7c6" font-size="16">Who needs to react?</text>

    <circle cx="595" cy="291" r="30" fill="#214b3b"/><path d="M580 300 L595 280 L610 300" fill="none" stroke="#7aefba" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="595" y="354" fill="#72ecb3" font-size="16" font-weight="700" letter-spacing="2">STRATEGY</text>
    <text x="595" y="390" fill="#f4f7fa" font-size="21" font-weight="700">Choose it</text>
    <text x="595" y="423" fill="#a9b7c6" font-size="16">Which delivery rule?</text>

    <circle cx="825" cy="291" r="30" fill="#214b3b"/><path d="M812 280 h26 v22 h-26 z M818 275 h14" fill="none" stroke="#7aefba" stroke-width="3" stroke-linejoin="round"/>
    <text x="825" y="354" fill="#72ecb3" font-size="16" font-weight="700" letter-spacing="2">FACTORY</text>
    <text x="825" y="390" fill="#f4f7fa" font-size="21" font-weight="700">Create it</text>
    <text x="825" y="423" fill="#a9b7c6" font-size="16">Which sender is needed?</text>

    <circle cx="1055" cy="291" r="30" fill="#214b3b"/><path d="M1038 291 h12 M1060 291 h12 M1050 280 l10 11 -10 11" fill="none" stroke="#7aefba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1055" y="354" fill="#72ecb3" font-size="16" font-weight="700" letter-spacing="2">ADAPTER</text>
    <text x="1055" y="390" fill="#f4f7fa" font-size="21" font-weight="700">Translate it</text>
    <text x="1055" y="423" fill="#a9b7c6" font-size="16">What does the API expect?</text>
  </g>
  <g fill="none" stroke="url(#path)" stroke-width="4" marker-end="url(#arrow)">
    <path d="M215 360 H254"/>
    <path d="M460 360 H484"/>
    <path d="M690 360 H714"/>
    <path d="M920 360 H944"/>
  </g>
  <path d="M1055 505 V560 H600" fill="none" stroke="#526273" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="420" y="555" width="360" height="84" rx="20" fill="#111a23" stroke="#334454" stroke-width="2"/>
  <text x="600" y="590" fill="#7aefba" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">EXTERNAL PROVIDER</text>
  <text x="600" y="617" fill="#e9eef3" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Email, SMS, or push service</text>
</svg>
