<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Tangled software compared with software with clear boundaries</title>
  <desc id="desc">On the left, a small SMS change is connected to many overlapping parts. On the right, the same change moves through three clear boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#151d28"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ddc91"/>
      <stop offset="1" stop-color="#79f2bd"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#50e3a4"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/>
  <line x1="600" y1="70" x2="600" y2="650" stroke="#2b3645" stroke-width="2"/>

  <text x="300" y="76" fill="#f5f7fa" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Everything knows everything</text>
  <text x="300" y="111" fill="#94a2b3" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">One request ripples through the whole system</text>
  <rect x="185" y="145" width="230" height="72" rx="36" fill="#17382d" stroke="#39dc97" stroke-width="2" filter="url(#glow)"/>
  <text x="300" y="190" fill="#eafff5" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">“Add SMS”</text>

  <g fill="#202a37" stroke="#49576a" stroke-width="2">
    <rect x="76" y="310" width="170" height="72" rx="16"/>
    <rect x="354" y="292" width="170" height="72" rx="16"/>
    <rect x="113" y="470" width="170" height="72" rx="16"/>
    <rect x="334" y="488" width="170" height="72" rx="16"/>
    <rect x="215" y="585" width="170" height="72" rx="16"/>
  </g>
  <g fill="#e7edf5" font-family="Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
    <text x="161" y="354">Checkout</text>
    <text x="439" y="336">Order logic</text>
    <text x="198" y="514">Customer data</text>
    <text x="419" y="532">Email code</text>
    <text x="300" y="629">Error handling</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="3" opacity=".9">
    <path d="M257 217 C90 255 515 245 161 310" stroke="#f08b68"/>
    <path d="M310 217 C530 245 110 400 439 292" stroke="#f0b968"/>
    <path d="M275 217 C230 310 480 385 198 470" stroke="#e16881"/>
    <path d="M330 217 C370 320 130 430 419 488" stroke="#f08b68"/>
    <path d="M298 217 C520 395 75 490 300 585" stroke="#e16881"/>
    <path d="M161 382 C330 440 455 390 419 488" stroke="#77869a"/>
    <path d="M439 364 C350 425 240 420 198 470" stroke="#77869a"/>
    <path d="M198 542 C250 575 350 575 419 560" stroke="#77869a"/>
  </g>

  <text x="900" y="76" fill="#f5f7fa" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Responsibilities have boundaries</text>
  <text x="900" y="111" fill="#94a2b3" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">The request follows a path we can reason about</text>
  <rect x="785" y="145" width="230" height="72" rx="36" fill="#17382d" stroke="#39dc97" stroke-width="2" filter="url(#glow)"/>
  <text x="900" y="190" fill="#eafff5" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">“Add SMS”</text>
  <g fill="#18232e" stroke="#3e5262" stroke-width="2">
    <rect x="740" y="290" width="320" height="80" rx="18"/>
    <rect x="740" y="430" width="320" height="80" rx="18"/>
    <rect x="740" y="570" width="320" height="80" rx="18"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="900" y="323" fill="#7cf1bd" font-size="15" font-weight="700" letter-spacing="2">DECIDE</text>
    <text x="900" y="350" fill="#f0f4f8" font-size="21" font-weight="700">Choose the message channel</text>
    <text x="900" y="463" fill="#7cf1bd" font-size="15" font-weight="700" letter-spacing="2">CREATE</text>
    <text x="900" y="490" fill="#f0f4f8" font-size="21" font-weight="700">Provide the right sender</text>
    <text x="900" y="603" fill="#7cf1bd" font-size="15" font-weight="700" letter-spacing="2">CONNECT</text>
    <text x="900" y="630" fill="#f0f4f8" font-size="21" font-weight="700">Translate for the provider</text>
  </g>
  <g fill="none" stroke="url(#green)" stroke-width="4" marker-end="url(#arrow)">
    <path d="M900 217 L900 276"/>
    <path d="M900 370 L900 416"/>
    <path d="M900 510 L900 556"/>
  </g>
</svg>
